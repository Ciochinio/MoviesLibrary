<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<title>Media Library</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --text:#eee; --dim:#999; --accent:#a78bfa; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior:none; touch-action:pan-x pan-y; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px -apple-system, system-ui, sans-serif; }
  button, select, input { font:inherit; color:inherit; }
  .hidden { display:none !important; }

  #login { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:14px; padding:24px; }
  #login input { width:200px; padding:12px; font-size:22px; text-align:center; letter-spacing:6px; border-radius:12px; border:1px solid #333; background:var(--card); }
  #login button, .btn { padding:10px 18px; border-radius:10px; border:0; background:var(--accent); color:#111; font-weight:600; }
  #loginError { color:#f87171; min-height:1.2em; }

  header { position:sticky; top:0; z-index:5; background:rgba(17,17,17,.94); backdrop-filter:blur(10px);
           padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; display:flex; flex-wrap:wrap; gap:8px; }
  header select, header input { flex:1 1 140px; min-width:0; padding:9px 10px; border-radius:10px; border:1px solid #333; background:var(--card); }
  #tagsBtn, #calibBtn { flex:0 0 auto; padding:9px 12px; border-radius:10px; border:1px solid #333; background:var(--card); }
  #tagsBtn.active { border-color:var(--accent); color:var(--accent); }
  #count { width:100%; color:var(--dim); font-size:12px; }
  #secureBanner { width:100%; color:var(--accent); font-size:13px; text-decoration:none; }

  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; padding:8px 8px calc(env(safe-area-inset-bottom) + 16px); }
  .card { position:relative; background:var(--card); border-radius:10px; overflow:hidden; }
  .card .th { aspect-ratio:16/10; background:#000 center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:#555; font-size:28px; }
  .card .nm { padding:6px 8px; font-size:12px; line-height:1.3; height:2.6em; overflow:hidden; color:#ccc; word-break:break-word; }
  .badges { position:absolute; right:6px; top:6px; display:flex; gap:4px; }
  .badge { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; background:rgba(0,0,0,.7); }
  .badge.vr { background:rgba(124,58,237,.9); }
  .badge.warn { background:rgba(180,83,9,.9); }

  #tagSheet { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; }
  #tagSheet .sheet { width:100%; max-height:75vh; overflow:auto; background:#1a1a1a; border-radius:16px 16px 0 0; padding:14px 12px calc(env(safe-area-inset-bottom) + 14px); }
  #tagSheet h4 { margin:14px 0 6px; color:var(--dim); font-weight:500; font-size:13px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:6px 10px; border-radius:999px; border:1px solid #333; background:var(--card); font-size:13px; }
  .chip.on { background:var(--accent); color:#111; border-color:var(--accent); }
  .sheetBar { display:flex; gap:8px; position:sticky; top:-14px; background:#1a1a1a; padding:4px 0 8px; }

  #player { position:fixed; inset:0; z-index:30; background:#000; display:flex; flex-direction:column; }
  #player .bar { display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 6px) 8px 6px; }
  #player .bar .t { flex:1; font-size:13px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#ccc; }
  #player .bar button { background:#222; border:0; border-radius:8px; padding:8px 12px; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  #stage video, #stage img { max-width:100%; max-height:100%; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <h2>Media Library</h2>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
  <button id="loginBtn">Unlock</button>
  <div id="loginError"></div>
</div>

<div id="main" class="hidden">
  <header>
    <select id="source"></select>
    <input id="q" type="search" placeholder="Search file name">
    <button id="tagsBtn">Tags</button>
    <button id="calibBtn" title="Calibrate headset">🎯</button>
    <div id="count"></div>
    <a id="secureBanner" class="hidden" href="#">🥽 For head tracking in VR, set up secure mode →</a>
  </header>
  <div id="grid"></div>
</div>

<div id="tagSheet" class="hidden">
  <div class="sheet">
    <div class="sheetBar">
      <button class="btn" id="tagsDone">Show results</button>
      <button class="btn" id="tagsClear" style="background:#333;color:#eee">Clear</button>
    </div>
    <div id="tagLists"></div>
  </div>
</div>

<div id="player" class="hidden">
  <div class="bar">
    <button id="pClose">✕</button>
    <div class="t" id="pTitle"></div>
    <button id="pVr">🥽 Cinema</button>
    <button id="pPrev">‹</button>
    <button id="pNext">›</button>
  </div>
  <div id="stage"></div>
</div>

<script src="/vr.js"></script>
<script>
const $ = id => document.getElementById(id);
// Safari ignores user-scalable=no; block pinch and double-tap zoom by hand
for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  // The VR player blocks zoom itself (touch-action: none) and needs fast repeated taps
  if (e.target.closest && e.target.closest('#vrp')) return;
  const now = Date.now();
  if (now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
let token = localStorage.getItem('pml_token') || '';
let library = null, items = [], current = -1;
const selTags = new Set(), selKv = new Set();
// Formats Safari can't play
const UNPLAYABLE = new Set(['.mkv', '.avi', '.webm']);

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ credentials: 'same-origin' }, opts));
  if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const withToken = url => url + (url.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token);

function showLogin() {
  $('main').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('pin').focus();
}

async function login() {
  $('loginError').textContent = '';
  const r = await fetch('/api/login', { method: 'POST', body: JSON.stringify({ pin: $('pin').value }) });
  if (r.status === 429) { $('loginError').textContent = 'Too many attempts, wait a minute.'; return; }
  if (!r.ok) { $('loginError').textContent = 'Wrong PIN'; return; }
  token = (await r.json()).token;
  localStorage.setItem('pml_token', token);
  $('pin').value = '';
  start();
}

async function start() {
  try { library = await api('/api/library'); } catch { return; }
  // The secure page has its own storage; the login cookie is shared, so take the token from here
  if (library.token && library.token !== token) { token = library.token; localStorage.setItem('pml_token', token); }
  if (!window.isSecureContext && library.setupUrl) {
    $('secureBanner').href = '/setup';
    $('secureBanner').classList.remove('hidden');
  }
  $('login').classList.add('hidden');
  $('main').classList.remove('hidden');

  const src = $('source');
  src.innerHTML = '';
  const add = (parent, value, label) => { const o = document.createElement('option'); o.value = value; o.textContent = label; parent.appendChild(o); };
  add(src, 'fav', '★ Favourites');
  add(src, 'vr', '🥽 VR videos');
  add(src, 'search', '🔍 Search everything');
  for (const c of library.categories) {
    const g = document.createElement('optgroup'); g.label = c.name;
    for (const s of c.subs) add(g, 'sub:' + s.id, s.name);
    src.appendChild(g);
  }
  src.value = localStorage.getItem('pml_source') || 'fav';
  if (src.selectedIndex < 0) src.value = 'fav';
  buildTagLists();
  load();
}

function buildTagLists() {
  const box = $('tagLists'); box.innerHTML = '';
  const section = (title, entries, set) => {
    if (!entries.length) return;
    const h = document.createElement('h4'); h.textContent = title; box.appendChild(h);
    const chips = document.createElement('div'); chips.className = 'chips';
    for (const [id, label] of entries) {
      const c = document.createElement('button');
      c.className = 'chip' + (set.has(id) ? ' on' : ''); c.textContent = label;
      c.onclick = () => { set.has(id) ? set.delete(id) : set.add(id); c.classList.toggle('on'); };
      chips.appendChild(c);
    }
    box.appendChild(chips);
  };
  section('Tags', library.tags.map(t => [t.id, t.name]), selTags);
  for (const k of library.keys) section(k.key, k.values.map(v => [v.id, v.value]), selKv);
}

let loadSeq = 0;
async function load() {
  const seq = ++loadSeq;
  const src = $('source').value, q = $('q').value.trim();
  localStorage.setItem('pml_source', src);
  const hasTags = selTags.size + selKv.size > 0;
  $('tagsBtn').classList.toggle('active', hasTags);
  $('tagsBtn').textContent = hasTags ? `Tags (${selTags.size + selKv.size})` : 'Tags';

  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (hasTags || src === 'search') {
    // Tag filters always search the whole library
    params.set('tags', [...selTags].join(','));
    params.set('kv', [...selKv].join(','));
  } else if (src === 'fav') params.set('fav', '1');
  else if (src === 'vr') params.set('vr', '1');
  else if (src.startsWith('sub:')) params.set('sub', src.slice(4));

  let list;
  try { list = await api('/api/items?' + params); } catch { return; }
  if (seq !== loadSeq) return;
  items = list;
  render();
}

function render() {
  const grid = $('grid'); grid.innerHTML = '';
  $('count').textContent = items.length === 1 ? '1 item' : items.length + ' items';
  items.forEach((it, i) => {
    const card = document.createElement('div'); card.className = 'card';
    const th = document.createElement('div'); th.className = 'th';
    if (it.thumb) th.style.backgroundImage = `url("${withToken('/thumbs/' + it.id)}")`;
    else if (it.type === 'image') th.style.backgroundImage = `url("${withToken('/media/' + it.id)}")`;
    else th.textContent = '▶';
    card.appendChild(th);
    const badges = document.createElement('div'); badges.className = 'badges';
    if (it.vr) badges.innerHTML += `<span class="badge vr">VR</span>`;
    if (it.type === 'video' && UNPLAYABLE.has(it.ext)) badges.innerHTML += `<span class="badge warn">${it.ext.slice(1).toUpperCase()}</span>`;
    card.appendChild(badges);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
    card.appendChild(nm);
    card.onclick = () => open(i);
    grid.appendChild(card);
  });
}

// VR tag → projection + layout for the VR player
const VR_FORMATS = {
  '180 SBS': { proj: 180, layout: 'sbs' },
  '360 SBS': { proj: 360, layout: 'sbs' },
  '360 TB': { proj: 360, layout: 'tb' },
  '3D SBS': { proj: 'cinema', layout: 'sbs' },
};

/// Next/previous video from i, skipping images.
function stepVideo(i, dir) {
  for (let j = i + dir; j >= 0 && j < items.length; j += dir) if (items[j].type === 'video') return j;
  return -1;
}

function openVr(i) {
  const it = items[i];
  if (!it || it.type !== 'video') return;
  current = i;
  closePlayer();
  const f = Object.assign({}, VR_FORMATS[it.vr] || { proj: 'cinema', layout: 'mono' });
  // Fisheye VR180 (newer cameras) is stored differently from regular VR180
  if (f.proj === 180) {
    const n = it.name.toLowerCase();
    const m = n.match(/fisheye[\s_-]?(180|190|200)/);
    if (m) f.proj = 'f' + m[1];
    else if (/mkx[\s_-]?200/.test(n)) f.proj = 'f200';
    else if (/fisheye|rf52|mkx/.test(n)) f.proj = 'f190';
  }
  VRPlayer.open({
    url: withToken('/media/' + it.id),
    title: it.name,
    proj: f.proj,
    layout: f.layout,
    onPrev: () => { const j = stepVideo(current, -1); if (j >= 0) openVr(j); },
    onNext: () => { const j = stepVideo(current, 1); if (j >= 0) openVr(j); },
  });
}

function open(i) {
  if (i < 0 || i >= items.length) return;
  // VR videos go straight to the VR player
  if (items[i].type === 'video' && items[i].vr) return openVr(i);
  current = i;
  const it = items[i];
  $('pVr').classList.toggle('hidden', it.type !== 'video');
  $('pTitle').textContent = it.name;
  const stage = $('stage'); stage.innerHTML = '';
  const url = withToken('/media/' + it.id);
  if (it.type === 'video') {
    const v = document.createElement('video');
    v.src = url; v.controls = true; v.playsInline = true; v.autoplay = true;
    stage.appendChild(v);
  } else {
    const img = document.createElement('img'); img.src = url; stage.appendChild(img);
  }
  $('player').classList.remove('hidden');
}

function closePlayer() {
  $('stage').innerHTML = '';   // stops the stream
  $('player').classList.add('hidden');
}

$('loginBtn').onclick = login;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('source').onchange = load;
let qTimer;
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(load, 300); });
$('tagsBtn').onclick = () => $('tagSheet').classList.remove('hidden');
$('tagsDone').onclick = () => { $('tagSheet').classList.add('hidden'); load(); };
$('tagsClear').onclick = () => { selTags.clear(); selKv.clear(); buildTagLists(); };
$('tagSheet').addEventListener('click', e => { if (e.target.id === 'tagSheet') { $('tagSheet').classList.add('hidden'); load(); } });
$('pClose').onclick = closePlayer;
$('pVr').onclick = () => openVr(current);
$('calibBtn').onclick = () => VRPlayer.open({ calibrate: true, title: 'Calibration', proj: 'cinema', layout: 'mono' });
$('pPrev').onclick = () => open(current - 1);
$('pNext').onclick = () => open(current + 1);

start();
</script>
</body>
</html>
