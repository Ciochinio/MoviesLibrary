name: portable_media_library
description: Portable media library (Windows/macOS first) with categories, tags, and notes.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  file_picker: ^8.0.6
  crypto: ^3.0.3
  uuid: ^4.4.2
  open_filex: ^4.5.0
  intl: ^0.19.0
  desktop_drop: ^0.4.4
  google_fonts: ^6.2.1
  # ── In-app media player ────────────────────────────────────────────────────
  media_kit: ^1.1.11                      # core player API
  media_kit_video: ^1.2.5                 # video renderer widget
  media_kit_libs_windows_video: ^1.0.9    # Windows native libs (FFmpeg bundled)
  window_manager: ^0.3.9                  # True OS fullscreen

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
